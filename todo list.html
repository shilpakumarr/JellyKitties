<div class="container">
    <h1>To-Do List</h1>

<!-- Dropdown -->
    <select id="taskSelect">
    <option value="">Choose a task</option>
    <option value="Feed the cat">Feed the cat</option>
    <option value="Clean litter box">Clean litter box</option>
    <option value="Play with cat">Play with cat</option>
</select>

<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>
</div>

<footer>
<p>jellykitties2026</p>
</footer>


<script>
const taskSelect = document.getElementById("taskSelect");
const taskList = document.getElementById("taskList");

function addTask() {
    const taskText = taskSelect.value;

    if (taskText === "") {
    alert("Please select a task!");
    return;
}

const li = document.createElement("li");
li.textContent = taskText;

const deleteButton = document.createElement("button");
deleteButton.textContent = "Complete";
deleteButton.addEventListener("click", () => {
deleteTask(li);
});

li.appendChild(deleteButton);
taskList.appendChild(li);
}

function deleteTask(taskElement) {
taskList.removeChild(taskElement);
}
</script>

</body>

</html>
